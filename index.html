<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open-Meteo Weather App</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <div class="app-container">
        <h1>⛅ Open-Meteo Weather</h1>

        <div class="search-bar">
            <input type="text" id="cityInput" placeholder="Enter city name (e.g., London, Tokyo)…" autocomplete="off">
            <button id="searchBtn">Search</button>
        </div>

        <div id="errorMessage" class="error-message"></div>
        <div id="loading" class="loading">Fetching weather data…</div>

        <div id="weatherContent" class="hidden">
            <!-- Current Weather -->
            <div class="current-weather" id="currentWeather">
                <div class="location-name" id="locationName"></div>
                <div class="location-detail" id="locationDetail"></div>
                <div class="current-main">
                    <span class="current-icon" id="currentIcon">☀️</span>
                    <div>
                        <div class="current-temp" id="currentTemp"></div>
                        <div class="current-desc" id="currentDesc"></div>
                    </div>
                </div>
                <div class="current-meta" id="currentMeta"></div>
            </div>

            <!-- Hourly Forecast -->
            <div class="section-title">Hourly Forecast (next 24h)</div>
            <div class="hourly-scroll" id="hourlyForecast"></div>

            <!-- Daily Forecast -->
            <div class="section-title">7-Day Forecast</div>
            <div class="daily-list" id="dailyForecast"></div>
        </div>
    </div>

</body>
</html>
