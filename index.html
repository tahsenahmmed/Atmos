<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkyCast — Animated Weather</title>
<link rel="stylesheet" href="style.css">
<base target="_blank">
</head>
<body>

<!-- Animated background layers -->
<canvas id="fx-canvas"></canvas>
<div class="aurora"></div>
<div class="cloud-layer" id="cloudLayer"></div>

<main class="app">
  <button class="unit-toggle" id="unitBtn">°C / °F</button>

  <header class="app-header">
    <h1 class="logo">Sky<span>Cast</span></h1>
    <p class="tagline">Animated weather, powered by Open-Meteo</p>
  </header>

  <div class="search-box">
    <div class="input-wrap">
      <input id="cityInput" type="text" placeholder="Search a city… e.g. Tokyo" autocomplete="off">
      <div class="suggestions" id="suggestions"></div>
    </div>
    <button class="btn btn-primary" onclick="searchCity()">Search</button>
    <button class="btn btn-ghost" onclick="useLocation()">📍 My Location</button>
  </div>

  <div class="error" id="error"></div>
  <div id="content"><div class="loading">Search for a city or use your location ↑</div></div>
</main>

<script src="app.js"></script>
</body>
</html>
